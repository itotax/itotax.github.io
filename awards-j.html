  <style>
    :root {
      --primary: #0f2044;
      --accent:  #2563eb;
      --accent-light: #eff6ff;
      --accent-mid:   #bfdbfe;
      --text:    #1f2937;
      --text-sec:#6b7280;
      --bg:      #ffffff;
      --bg-sec:  #f9fafb;
      --border:  #e5e7eb;
      --radius:  8px;
      --max-w:   900px;
      --nav-h:   58px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { font-family: 'Noto Sans JP', 'Inter', system-ui, sans-serif; color: var(--text); background: var(--bg); font-size: 15px; line-height: 1.8; -webkit-font-smoothing: antialiased; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    nav {
      position: sticky; top: 0; z-index: 200;
      height: var(--nav-h);
      background: rgba(255,255,255,0.93);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
    }
    .nav-inner {
      max-width: var(--max-w); margin: 0 auto;
      padding: 0 1.5rem; height: 100%;
      display: flex; align-items: center; gap: 1rem;
    }
    .nav-back {
      font-size: .82rem; font-weight: 700;
      color: var(--primary); white-space: nowrap;
      padding: .3rem .75rem; border-radius: 6px;
      background: var(--accent-light); border: 1px solid var(--accent-mid);
    }
    .nav-back:hover { background: #dbeafe; text-decoration: none; }
    .nav-title { font-weight: 600; font-size: .95rem; color: var(--primary); }
    .nav-title span { font-weight: 400; color: var(--text-sec); font-size: .85rem; margin-left: .5rem; }
    .lang-pill {
      margin-left: auto;
      display: inline-flex; border: 1px solid var(--border);
      border-radius: 20px; overflow: hidden;
    }
    .lang-pill a {
      font-size: .75rem; font-weight: 700;
      padding: .22rem .6rem; color: var(--text-sec); transition: all .15s;
    }
    .lang-pill a.on { background: var(--accent); color: #fff; }
    .lang-pill a:hover { text-decoration: none; }

    .wrap { max-width: var(--max-w); margin: 0 auto; padding: 2.5rem 1.5rem 5rem; }

    .controls {
      display: flex; flex-wrap: wrap; gap: .75rem;
      align-items: center; margin-bottom: 1.75rem;
      padding-bottom: 1.5rem; border-bottom: 1px solid var(--border);
    }
    .search-box {
      flex: 1 1 220px;
      display: flex; align-items: center; gap: .5rem;
      background: var(--bg-sec); border: 1px solid var(--border);
      border-radius: var(--radius); padding: .45rem .85rem;
    }
    .search-box input {
      border: none; background: transparent; outline: none;
      font-size: .875rem; font-family: inherit; width: 100%; color: var(--text);
    }
    .filter-group { display: flex; gap: .35rem; flex-wrap: wrap; }
    .filter-btn {
      font-size: .78rem; font-weight: 600;
      padding: .3rem .75rem; border-radius: 20px;
      border: 1px solid var(--border); background: var(--bg-sec);
      color: var(--text-sec); cursor: pointer; transition: all .15s;
      white-space: nowrap; font-family: inherit;
    }
    .filter-btn:hover  { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }
    .filter-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .count-bar { font-size: .8rem; color: var(--text-sec); margin-left: auto; white-space: nowrap; }

    .year-group { margin-bottom: 2.25rem; }
    .year-heading {
      font-size: .78rem; font-weight: 700; letter-spacing: .08em;
      color: var(--text-sec);
      margin-bottom: .25rem; padding-bottom: .4rem;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: .5rem;
    }
    .year-heading span { font-size: 1rem; font-weight: 700; color: var(--primary); }

    .award-row {
      display: grid;
      grid-template-columns: 110px 1fr;
      gap: 1rem;
      padding: .85rem .25rem;
      border-bottom: 1px solid var(--border);
      align-items: baseline;
    }
    .award-row:last-child { border-bottom: none; }
    .award-tag {
      font-size: .68rem; font-weight: 700;
      letter-spacing: .03em;
      padding: .15rem .55rem; border-radius: 20px;
      text-align: center; justify-self: start;
    }
    .tag-national   { background: #fef3c7; color: #92400e; border: 1px solid #fde68a; }
    .tag-society    { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }
    .tag-bestpaper  { background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; }
    .tag-competition{ background: #fce7f3; color: #9d174d; border: 1px solid #fbcfe8; }
    .tag-other      { background: #f3f4f6; color: #374151; border: 1px solid #d1d5db; }
    .award-body { font-size: .9rem; line-height: 1.75; }
    .award-body strong { color: var(--primary); }

    .empty { text-align: center; padding: 4rem 1rem; color: var(--text-sec); }
    .empty p { font-size: 1.1rem; margin-bottom: .5rem; }

    #back-top {
      position: fixed; bottom: 2rem; right: 1.5rem;
      background: var(--accent); color: #fff;
      width: 42px; height: 42px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem; box-shadow: 0 4px 12px rgba(37,99,235,.35);
      opacity: 0; transition: opacity .3s; z-index: 900;
    }
    #back-top.on { opacity: 1; }
    #back-top:hover { background: #1d4ed8; text-decoration: none; }

    @media (max-width: 600px) {
      .award-row { grid-template-columns: 1fr; gap: .25rem; }
      .controls { flex-direction: column; align-items: stretch; }
    }
  </style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a class="nav-back" href="index-j.html">← 伊藤孝行</a>
    <span class="nav-title">受賞歴 <span>伊藤孝行</span></span>
    <div class="lang-pill">
      <a href="awards.html">EN</a>
      <a href="awards-j.html" class="on">JA</a>
    </div>
  </div>
</nav>

<div class="wrap">
  <div class="controls">
    <div class="search-box">
      <span>🔍</span>
      <input type="text" id="search" placeholder="受賞を検索…" oninput="render()">
    </div>
    <div class="filter-group" id="tag-filters">
      <button class="filter-btn active" onclick="setFilter('all',this)">すべて</button>
      <button class="filter-btn" onclick="setFilter('national',this)">🏅 国・政府</button>
      <button class="filter-btn" onclick="setFilter('society',this)">🏛 学会</button>
      <button class="filter-btn" onclick="setFilter('bestpaper',this)">📰 論文賞</button>
      <button class="filter-btn" onclick="setFilter('competition',this)">🥇 競技会</button>
    </div>
    <span class="count-bar" id="count-bar"></span>
  </div>
  <div id="awards-list"></div>
</div>

<a id="back-top" href="#">↑</a>

<script>
const LANG = 'ja';
const TAG_LABEL = {
  national:'国・政府', society:'学会', bestpaper:'論文賞',
  competition:'競技会', other:'その他'
};

let ALL = [];
let activeFilter = 'all';

function setFilter(f, btn) {
  activeFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function bodyOf(e)   { return e[LANG] || e.ja || e.en || e.note || e.title || ''; }
function linkLabel(e){ return e['link_'+LANG] || (LANG==='ja' ? 'リンク →' : 'Link →'); }
function yearOf(e)   { return e.year || (e.date || '').slice(0,4) || '—'; }

// ---------- BibTeX parser (extract @award only) ----------
function parseAwards(src) {
  src = src.replace(/^%.*$/gm, '');
  const re = /@award\s*\{\s*([^,\s]+)\s*,/gi;
  const list = [];
  let m;
  while ((m = re.exec(src)) !== null) {
    const key = m[1];
    let i = m.index + m[0].length;
    let depth = 1;
    while (i < src.length && depth > 0) {
      if (src[i] === '{') depth++;
      else if (src[i] === '}') depth--;
      i++;
    }
    const body = src.slice(m.index + m[0].length, i - 1);
    const entry = { _key: key };
    const fre = /(\w+)\s*=\s*(?:\{((?:[^{}]|\{(?:[^{}]|\{[^{}]*\})*\})*)\}|"([^"]*)"|(\d+))/g;
    let fm;
    while ((fm = fre.exec(body)) !== null) {
      const fname = fm[1].toLowerCase();
      const fval  = (fm[2] ?? fm[3] ?? fm[4] ?? '').trim();
      entry[fname] = fval.replace(/\s+/g, ' ');
    }
    list.push(entry);
  }
  return list;
}

function render() {
  const q = document.getElementById('search').value.toLowerCase();
  const filtered = ALL.filter(e => {
    if (activeFilter !== 'all' && (e.tag || 'other') !== activeFilter) return false;
    if (q) {
      const blob = (bodyOf(e) + ' ' + yearOf(e)).toLowerCase();
      if (!blob.includes(q)) return false;
    }
    return true;
  });

  document.getElementById('count-bar').textContent = `${filtered.length} 件`;

  const byYear = {};
  filtered.forEach(e => {
    const y = yearOf(e);
    (byYear[y] ||= []).push(e);
  });
  const years = Object.keys(byYear).sort((a,b) => {
    if (a === '—' || a === 'unknown') return 1;
    if (b === '—' || b === 'unknown') return -1;
    return b.localeCompare(a);
  });

  const c = document.getElementById('awards-list');
  if (!filtered.length) {
    c.innerHTML = '<div class="empty"><p>該当する受賞がありません。</p></div>';
    return;
  }
  c.innerHTML = years.map(y => `
    <div class="year-group">
      <div class="year-heading"><span>${y}</span> 年 — ${byYear[y].length} 件</div>
      ${byYear[y].map(rowHTML).join('')}
    </div>
  `).join('');
}

function rowHTML(e) {
  const tag  = e.tag || 'other';
  const body = bodyOf(e);
  const link = e.link ? ` <a href="${e.link}" target="_blank" rel="noopener">${linkLabel(e)}</a>` : '';
  return `
  <div class="award-row">
    <span class="award-tag tag-${tag}">${TAG_LABEL[tag] || tag}</span>
    <div class="award-body">${body}${link}</div>
  </div>`;
}

async function init() {
  try {
    const res = await fetch('publications.bib');
    if (res.ok) {
      const txt = await res.text();
      ALL = parseAwards(txt);
    }
  } catch(e) {}
  ALL.sort((a,b) => {
    const ya = yearOf(a), yb = yearOf(b);
    const yaIsUnknown = (ya === '—' || ya === 'unknown');
    const ybIsUnknown = (yb === '—' || yb === 'unknown');
    if (yaIsUnknown && !ybIsUnknown) return 1;
    if (ybIsUnknown && !yaIsUnknown) return -1;
    if (yb !== ya) return yb.localeCompare(ya);
    return (b.date || '').localeCompare(a.date || '');
  });
  if (!ALL.length) {
    document.getElementById('awards-list').innerHTML =
      '<div class="empty"><p>⚠️ publications.bib を読み込めませんでした</p><small>Web サーバー経由で開いてください。</small></div>';
    return;
  }
  render();
}

window.addEventListener('scroll', () => {
  document.getElementById('back-top').classList.toggle('on', scrollY > 400);
});

init();
</script>
</body>
</html>
