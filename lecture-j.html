  <style>
    :root {
      --primary: #0f2044;
      --accent:  #2563eb;
      --accent-light: #eff6ff;
      --accent-mid:   #bfdbfe;
      --text:    #1f2937;
      --text-sec:#6b7280;
      --bg:      #ffffff;
      --bg-sec:  #f9fafb;
      --border:  #e5e7eb;
      --radius:  8px;
      --max-w:   900px;
      --nav-h:   58px;
      /* institution colors */
      --kyoto:  #7c3aed;  --kyoto-bg:  #f5f3ff;  --kyoto-bd:  #ddd6fe;
      --nitech: #2563eb;  --nitech-bg: #eff6ff;  --nitech-bd: #bfdbfe;
      --jaist:  #0d9488;  --jaist-bg:  #f0fdfa;  --jaist-bd:  #99f6e4;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', 'Noto Sans JP', system-ui, sans-serif;
      color: var(--text); background: var(--bg);
      font-size: 15px; line-height: 1.8; -webkit-font-smoothing: antialiased;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* ---------- nav ---------- */
    nav {
      position: sticky; top: 0; z-index: 200;
      height: var(--nav-h);
      background: rgba(255,255,255,0.93);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
    }
    .nav-inner {
      max-width: var(--max-w); margin: 0 auto;
      padding: 0 1.5rem; height: 100%;
      display: flex; align-items: center; gap: 1rem;
    }
    .nav-back {
      font-size: .82rem; font-weight: 700;
      color: var(--primary); white-space: nowrap;
      padding: .3rem .75rem; border-radius: 6px;
      background: var(--accent-light); border: 1px solid var(--accent-mid);
    }
    .nav-back:hover { background: #dbeafe; text-decoration: none; }
    .nav-title { font-weight: 600; font-size: .95rem; color: var(--primary); }
    .nav-title span { font-weight: 400; color: var(--text-sec); font-size: .85rem; margin-left: .5rem; }
    .lang-pill {
      margin-left: auto;
      display: inline-flex; border: 1px solid var(--border);
      border-radius: 20px; overflow: hidden;
    }
    .lang-pill a {
      font-size: .75rem; font-weight: 700;
      padding: .22rem .6rem; color: var(--text-sec); transition: all .15s;
    }
    .lang-pill a.on { background: var(--accent); color: #fff; }
    .lang-pill a:hover { text-decoration: none; }

    .wrap { max-width: var(--max-w); margin: 0 auto; padding: 2.5rem 1.5rem 5rem; }

    /* ---------- hero ---------- */
    .hero { margin-bottom: 2.25rem; }
    .hero h1 {
      font-size: 1.75rem; font-weight: 700; color: var(--primary);
      letter-spacing: -.01em; line-height: 1.4;
    }
    .hero .lede { color: var(--text-sec); font-size: .92rem; margin-top: .5rem; max-width: 46em; }
    .stats { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: 1.15rem; }
    .stat {
      background: var(--bg-sec); border: 1px solid var(--border);
      border-radius: var(--radius); padding: .45rem .85rem;
      font-size: .78rem; color: var(--text-sec);
    }
    .stat b { color: var(--primary); font-size: 1rem; font-weight: 700; margin-right: .3rem; }

    /* ---------- current year ---------- */
    .current {
      position: relative; overflow: hidden;
      border-radius: 14px; padding: 1.4rem 1.5rem 1.5rem;
      background: linear-gradient(135deg, #0f2044 0%, #1e3a8a 55%, #4c1d95 100%);
      color: #fff; box-shadow: 0 12px 32px -14px rgba(15,32,68,.55);
    }
    .current::after {
      content: ''; position: absolute; right: -60px; top: -60px;
      width: 220px; height: 220px; border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,.14), transparent 70%);
      pointer-events: none;
    }
    .current-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: .4rem .75rem; margin-bottom: 1rem; }
    .current-kicker {
      font-size: .7rem; font-weight: 700; letter-spacing: .12em;
      text-transform: uppercase; color: #c7d2fe;
    }
    .current-title { font-size: 1.15rem; font-weight: 700; }
    .current-title small { font-size: .82rem; font-weight: 500; color: #c7d2fe; margin-left: .4rem; }
    .current-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(245px, 1fr));
      gap: .6rem; position: relative; z-index: 1;
    }
    .cc {
      background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.16);
      border-radius: 10px; padding: .7rem .85rem;
      backdrop-filter: blur(4px); transition: background .15s, transform .15s;
    }
    .cc:hover { background: rgba(255,255,255,.13); transform: translateY(-1px); }
    .cc-name { font-size: .9rem; font-weight: 600; line-height: 1.5; }
    .cc-meta { display: flex; align-items: center; gap: .45rem; margin-top: .3rem; font-size: .74rem; color: #c7d2fe; }
    .cc .term { background: rgba(255,255,255,.14); color: #fff; border-color: rgba(255,255,255,.25); }
    .current-more { margin-top: .8rem; font-size: .76rem; color: #c7d2fe; position: relative; z-index: 1; }

    /* ---------- section headers ---------- */
    .section { margin-top: 3rem; }
    .section-head {
      display: flex; align-items: baseline; gap: .6rem; flex-wrap: wrap;
      padding-bottom: .6rem; margin-bottom: 1.25rem;
      border-bottom: 2px solid var(--primary);
    }
    .section-head h2 { font-size: 1.05rem; font-weight: 700; color: var(--primary); }
    .section-head small { color: var(--text-sec); font-size: .78rem; font-weight: 400; }

    /* ---------- controls ---------- */
    .controls {
      display: flex; flex-wrap: wrap; gap: .75rem;
      align-items: center; margin-bottom: 1.75rem;
    }
    .search-box {
      flex: 1 1 220px;
      display: flex; align-items: center; gap: .5rem;
      background: var(--bg-sec); border: 1px solid var(--border);
      border-radius: var(--radius); padding: .45rem .85rem;
    }
    .search-box input {
      border: none; background: transparent; outline: none;
      font-size: .875rem; font-family: inherit; width: 100%; color: var(--text);
    }
    .filter-group { display: flex; gap: .35rem; flex-wrap: wrap; }
    .filter-btn {
      font-size: .78rem; font-weight: 600;
      padding: .3rem .75rem; border-radius: 20px;
      border: 1px solid var(--border); background: var(--bg-sec);
      color: var(--text-sec); cursor: pointer; transition: all .15s;
      white-space: nowrap; font-family: inherit;
    }
    .filter-btn:hover  { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }
    .filter-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .count-bar { font-size: .8rem; color: var(--text-sec); margin-left: auto; white-space: nowrap; }

    /* ---------- institution band ---------- */
    .inst { margin-bottom: 2.25rem; }
    .inst-band {
      display: flex; align-items: center; gap: .7rem; flex-wrap: wrap;
      padding: .6rem .9rem; margin-bottom: 1rem;
      border-radius: 10px; border: 1px solid var(--c-bd); background: var(--c-bg);
      position: sticky; top: calc(var(--nav-h) + .5rem); z-index: 40;
      backdrop-filter: blur(8px);
    }
    .inst-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 4px var(--c-bd); flex-shrink: 0; }
    .inst-name { font-weight: 700; color: var(--primary); font-size: .95rem; }
    .inst-period { font-size: .76rem; color: var(--text-sec); font-variant-numeric: tabular-nums; }
    .inst-count { margin-left: auto; font-size: .72rem; font-weight: 700; color: var(--c); }
    .i-kyoto  { --c: var(--kyoto);  --c-bg: var(--kyoto-bg);  --c-bd: var(--kyoto-bd); }
    .i-nitech { --c: var(--nitech); --c-bg: var(--nitech-bg); --c-bd: var(--nitech-bd); }
    .i-jaist  { --c: var(--jaist);  --c-bg: var(--jaist-bg);  --c-bd: var(--jaist-bd); }

    /* ---------- timeline ---------- */
    .year {
      display: grid; grid-template-columns: 112px 1fr; gap: 1.25rem;
      position: relative; padding-bottom: 1.4rem;
    }
    .year::before {                      /* the rail */
      content: ''; position: absolute; left: 118px; top: .55rem; bottom: 0;
      width: 2px; background: var(--border);
    }
    .year:last-child::before { bottom: auto; height: 1rem; }
    .year-label { text-align: right; padding-top: .1rem; }
    .year-fy { display: block; font-size: 1.15rem; font-weight: 700; color: var(--primary); font-variant-numeric: tabular-nums; line-height: 1.3; }
    .year-era { display: block; font-size: .72rem; color: var(--text-sec); line-height: 1.4; }
    .year-body { position: relative; padding-left: 1.25rem; }
    .year-body::before {                 /* the node */
      content: ''; position: absolute; left: -.25rem; top: .5rem;
      width: 12px; height: 12px; border-radius: 50%;
      background: #fff; border: 3px solid var(--c);
    }
    .course {
      display: grid; grid-template-columns: 1fr auto; gap: .2rem 1rem;
      padding: .5rem .75rem; border-radius: 8px;
      transition: background .15s;
    }
    .course:hover { background: var(--bg-sec); }
    .course-name { font-size: .9rem; font-weight: 600; color: var(--text); line-height: 1.55; }
    .course-detail { font-weight: 400; color: var(--text-sec); font-size: .8rem; margin-left: .35rem; }
    .course-target { grid-column: 1; font-size: .78rem; color: var(--text-sec); line-height: 1.5; }
    .course .term { grid-column: 2; grid-row: 1 / span 2; align-self: center; }
    .term {
      font-size: .68rem; font-weight: 700; white-space: nowrap;
      padding: .12rem .55rem; border-radius: 20px; border: 1px solid;
      justify-self: end;
    }
    .t-zenki  { background: #f0fdf4; color: #166534; border-color: #bbf7d0; }
    .t-kouki  { background: #fff7ed; color: #9a3412; border-color: #fed7aa; }
    .t-tsuunen{ background: #f5f3ff; color: #5b21b6; border-color: #ddd6fe; }
    .t-term   { background: #eff6ff; color: #1e40af; border-color: #bfdbfe; }
    .note {
      display: flex; gap: .55rem; align-items: flex-start;
      margin: .35rem .75rem .25rem; padding: .55rem .8rem;
      font-size: .82rem; line-height: 1.7;
      background: var(--c-bg); border: 1px solid var(--c-bd); border-radius: 8px;
    }
    .more { font-size: .76rem; color: var(--text-sec); padding: .2rem .75rem 0; }
    mark { background: #fef08a; color: inherit; border-radius: 2px; padding: 0 .1em; }

    .empty { text-align: center; padding: 4rem 1rem; color: var(--text-sec); }
    .empty p { font-size: 1.1rem; margin-bottom: .5rem; }

    #back-top {
      position: fixed; bottom: 2rem; right: 1.5rem;
      background: var(--accent); color: #fff;
      width: 42px; height: 42px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem; box-shadow: 0 4px 12px rgba(37,99,235,.35);
      opacity: 0; transition: opacity .3s; z-index: 900;
    }
    #back-top.on { opacity: 1; }
    #back-top:hover { background: #1d4ed8; text-decoration: none; }

    @media (max-width: 600px) {
      .hero h1 { font-size: 1.35rem; }
      .nav-title span { display: none; }
      .current { padding: 1.15rem 1rem 1.2rem; }
      .controls { flex-direction: column; align-items: stretch; }
      .search-box { flex: 0 0 auto; }
      .count-bar { margin-left: 0; }
      .year { grid-template-columns: 64px 1fr; gap: .75rem; }
      .year::before { left: 70px; }
      .year-fy { font-size: 1rem; }
      .year-era { font-size: .66rem; }
      .course { grid-template-columns: 1fr; padding: .45rem .5rem; }
      .course .term { grid-column: 1; grid-row: auto; justify-self: start; margin-top: .15rem; }
      .inst-count { margin-left: 0; }
    }
  </style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a class="nav-back" href="index-j.html">← 伊藤孝行</a>
    <span class="nav-title">担当講義 <span>伊藤孝行</span></span>
    <div class="lang-pill">
      <a href="index.html" title="英語版はありません（英語トップページへ）">EN</a>
      <a href="lecture-j.html" class="on">JA</a>
    </div>
  </div>
</nav>

<div class="wrap">

  <header class="hero">
    <h1>担当講義</h1>
    <p class="lede">京都大学・名古屋工業大学・北陸先端科学技術大学院大学で担当した主な講義科目を年度別にまとめています。</p>
    <div class="stats" id="stats"></div>
  </header>

  <section id="current"></section>

  <section class="section">
    <div class="section-head">
      <h2>年度別の担当科目</h2>
      <small>主なもの</small>
    </div>
    <div class="controls">
      <div class="search-box">
        <span>🔍</span>
        <input type="text" id="search" placeholder="科目名・対象・年度で検索…" oninput="render()">
      </div>
      <div class="filter-group" id="inst-filters"></div>
      <span class="count-bar" id="count-bar"></span>
    </div>
    <div id="timeline"></div>
  </section>

</div>

<a id="back-top" href="#">↑</a>

<script>
let DATA = null;
let activeInst = 'all';

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function termClass(t) {
  if (!t) return '';
  if (t.includes('・')) return 't-tsuunen';
  if (t.includes('ターム')) return 't-term';
  return t === '後期' ? 't-kouki' : 't-zenki';
}
const termChip = t => t ? `<span class="term ${termClass(t)}">${esc(t)}</span>` : '';

function hl(text, q) {
  const s = esc(text);
  if (!q) return s;
  const i = s.toLowerCase().indexOf(esc(q).toLowerCase());
  return i < 0 ? s : s.slice(0, i) + '<mark>' + s.slice(i, i + esc(q).length) + '</mark>' + s.slice(i + esc(q).length);
}

function renderStats() {
  const ys = DATA.years;
  const first = Math.min(...ys.map(y => y.fy));
  const names = new Set(ys.flatMap(y => y.courses.map(c => c.name)));
  document.getElementById('stats').innerHTML = `
    <span class="stat"><b>${ys.length}</b>年度分（${first}年度〜）</span>
    <span class="stat"><b>${Object.keys(DATA.institutions).length}</b>大学</span>
    <span class="stat"><b>${names.size}</b>科目</span>`;
}

function renderCurrent() {
  const y = DATA.years[0];
  const inst = DATA.institutions[y.inst];
  document.getElementById('current').innerHTML = `
    <div class="current">
      <div class="current-head">
        <span class="current-kicker">Now teaching</span>
        <span class="current-title">${esc(y.label)}<small>${y.fy}年度 · ${esc(inst.ja)}</small></span>
      </div>
      <div class="current-grid">
        ${y.courses.map(c => `
          <div class="cc">
            <div class="cc-name">${esc(c.name)}</div>
            <div class="cc-meta">${termChip(c.term)}<span>${esc(c.target)}</span></div>
          </div>`).join('')}
      </div>
      ${y.more ? '<div class="current-more">ほか</div>' : ''}
    </div>`;
}

function buildFilters() {
  const opts = [['all', 'すべて'], ...Object.entries(DATA.institutions).map(([k, v]) => [k, v.ja])];
  document.getElementById('inst-filters').innerHTML = opts.map(([k, label]) =>
    `<button class="filter-btn${k === activeInst ? ' active' : ''}" data-inst="${k}">${esc(label)}</button>`).join('');
  document.querySelectorAll('#inst-filters .filter-btn').forEach(b => b.addEventListener('click', () => {
    activeInst = b.dataset.inst;
    document.querySelectorAll('#inst-filters .filter-btn').forEach(x => x.classList.toggle('active', x === b));
    render();
  }));
}

function render() {
  const q = document.getElementById('search').value.trim();
  const ql = q.toLowerCase();

  // filter years → courses (a year still shows if its label / notes match)
  const years = DATA.years
    .filter(y => activeInst === 'all' || y.inst === activeInst)
    .map(y => {
      if (!ql) return y;
      const head = `${y.fy} ${y.label} ${(y.notes || []).join(' ')}`.toLowerCase();
      if (head.includes(ql)) return y;
      const courses = y.courses.filter(c =>
        `${c.name} ${c.target} ${c.term || ''} ${c.detail || ''}`.toLowerCase().includes(ql));
      return courses.length ? { ...y, courses, notes: [], more: false } : null;
    })
    .filter(Boolean);

  const n = years.reduce((s, y) => s + y.courses.length, 0);
  document.getElementById('count-bar').textContent = `${years.length} 年度 · ${n} 件`;

  const tl = document.getElementById('timeline');
  if (!years.length) {
    tl.innerHTML = '<div class="empty"><p>該当する講義がありません。</p></div>';
    return;
  }

  // group consecutive years by institution
  const groups = [];
  years.forEach(y => {
    const g = groups[groups.length - 1];
    if (g && g.inst === y.inst) g.years.push(y); else groups.push({ inst: y.inst, years: [y] });
  });

  tl.innerHTML = groups.map(g => {
    const inst = DATA.institutions[g.inst];
    return `
    <div class="inst i-${g.inst}">
      <div class="inst-band">
        <span class="inst-dot"></span>
        <span class="inst-name">${esc(inst.ja)}</span>
        <span class="inst-period">${esc(inst.period)}</span>
        <span class="inst-count">${g.years.length} 年度</span>
      </div>
      ${g.years.map(y => `
        <div class="year">
          <div class="year-label">
            <span class="year-fy">${y.fy}</span>
            <span class="year-era">${esc(y.label)}</span>
          </div>
          <div class="year-body">
            ${(y.notes || []).map(t => `<div class="note"><span>✈︎</span><span>${hl(t, q)}</span></div>`).join('')}
            ${y.courses.map(c => `
              <div class="course">
                <div class="course-name">${hl(c.name, q)}${c.detail ? `<span class="course-detail">${hl(c.detail, q)}</span>` : ''}</div>
                <div class="course-target">${hl(c.target, q)}</div>
                ${termChip(c.term)}
              </div>`).join('')}
            ${y.more ? '<div class="more">ほか</div>' : ''}
          </div>
        </div>`).join('')}
    </div>`;
  }).join('');
}

async function init() {
  try {
    const res = await fetch('lecture.json');
    if (res.ok) DATA = await res.json();
  } catch (e) {}
  if (!DATA) {
    document.getElementById('timeline').innerHTML =
      '<div class="empty"><p>⚠️ lecture.json を読み込めませんでした</p><small>Webサーバー経由でこのページを開いてください。</small></div>';
    return;
  }
  DATA.years.sort((a, b) => b.fy - a.fy);
  renderStats();
  renderCurrent();
  buildFilters();
  render();
}

window.addEventListener('scroll', () => {
  document.getElementById('back-top').classList.toggle('on', scrollY > 400);
});

init();
</script>
</body>
