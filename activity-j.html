      display: flex; flex-wrap: wrap; gap: .75rem;

      white-space: nowrap; font-family: inherit;
    }
    .filter-btn:hover  { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }
    .filter-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .count-bar { font-size: .8rem; color: var(--text-sec); margin-left: auto; white-space: nowrap; }

    /* ---------- timeline ---------- */
    .year-group { margin-bottom: 2rem; }

    .tag-pc       { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }

    .tag-steering { background: #f5f3ff; color: #5b21b6; border: 1px solid #ddd6fe; }
    .tag-other    { background: #f3f4f6; color: #374151; border: 1px solid #d1d5db; }

    @media (max-width: 600px) {

<div class="wrap">

  <header class="hero">
    <h1>学会・社会貢献活動</h1>
    <p class="lede">国際会議の運営、学会の理事・運営委員、論文誌の編集委員、プログラム委員などの活動記録。</p>
    <div class="stats" id="stats"></div>
  </header>

  <section class="section">
    <div class="section-head">
      <h2>主要役職</h2>
      <small>学会・理事・編集委員など（継続中を含む）</small>
    </div>
    <div class="role-grid" id="roles"></div>
  </section>

  <section class="section">
    <div class="section-head">
      <h2>年次別の活動</h2>
      <small>国際会議・委員会</small>
    </div>
    <div class="controls">
      <div class="search-box">
        <span>🔍</span>
        <input type="text" id="search" placeholder="会議名・役職・年で検索…" oninput="render()">
      </div>
      <div class="filter-group" id="tag-filters"></div>
      <span class="count-bar" id="count-bar"></span>
    </div>
    <div id="timeline"></div>
    <p class="note">このほか、多数の国際会議・ワークショップの運営に携わっています。</p>
  </section>

  <section class="section">
    <div class="section-head">
      <h2>査読・ゲストエディタ</h2>
      <small>論文誌・国際会議</small>
    </div>
    <div class="chips" id="reviewing"></div>
  </section>

</div>

<a id="back-top" href="#">↑</a>

<script>
const LANG = 'ja';

const TAG_LABEL = {
  chair:    '委員長',
  spc:      'シニアPC',
  pc:       'プログラム委員',
  editor:   '編集',
  steering: '理事・運営',
  other:    'その他'
};
const FILTERS = [
  ['all',      'すべて'],
  ['chair',    '委員長'],
  ['spc',      'シニアPC'],
  ['pc',       'プログラム委員'],
  ['steering', '理事・運営'],
  ['editor',   '編集']
];
const T = {
  items:     n => `${n} 件`,
  roles:     '件の主要役職',
  span:      '年の活動記録',
  listed:    '件の活動を掲載',
  none:      '該当する活動がありません。',
  loadfail:  'activity.json を読み込めませんでした',
  loadhint:  'Webサーバー経由でこのページを開いてください。'
};

let ALL = [], ROLES = [], REVIEWING = [];
let activeFilter = 'all';

function bodyOf(e) { return e[LANG] || e.ja || e.en || ''; }

function setFilter(f, btn) {
  activeFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function buildFilters() {
  document.getElementById('tag-filters').innerHTML = FILTERS.map(([k, label], i) =>
    `<button class="filter-btn${i === 0 ? ' active' : ''}" data-tag="${k}">${label}</button>`
  ).join('');
  document.querySelectorAll('#tag-filters .filter-btn').forEach(b => {
    b.addEventListener('click', () => setFilter(b.dataset.tag, b));
  });
}

function renderRoles() {
  document.getElementById('roles').innerHTML = ROLES.map(r => `
    <div class="role-card">
      <span class="role-period">${r.period || '—'}</span>
      <div class="role-body">${bodyOf(r)}</div>
    </div>`).join('');
}

function renderStats() {
  const years = ALL.map(e => e.year).filter(Boolean);
  const min = Math.min(...years), max = Math.max(...years);
  document.getElementById('stats').innerHTML = `
    <span class="stat"><b>${ROLES.length}</b>${T.roles}</span>
    <span class="stat"><b>${ALL.length}</b>${T.listed}</span>
    <span class="stat"><b>${min}–${max}</b>${T.span}</span>`;
}

function renderReviewing() {
  document.getElementById('reviewing').innerHTML =
    REVIEWING.map(r => `<span class="chip">${r}</span>`).join('');
}

function rowHTML(e) {
  const tag = e.tag || 'other';
  return `
  <div class="act-row">
    <span class="act-tag tag-${tag}">${TAG_LABEL[tag] || tag}</span>
    <div class="act-body">${bodyOf(e)}</div>
  </div>`;
}

function render() {
  const q = document.getElementById('search').value.toLowerCase().trim();
  const filtered = ALL.filter(e => {
    if (activeFilter !== 'all' && (e.tag || 'other') !== activeFilter) return false;
    if (q) {
      const blob = (bodyOf(e) + ' ' + e.en + ' ' + e.ja + ' ' + e.year).toLowerCase();
      if (!blob.includes(q)) return false;
    }
    return true;
  });

  document.getElementById('count-bar').textContent = T.items(filtered.length);

  const c = document.getElementById('timeline');
  if (!filtered.length) {
    c.innerHTML = `<div class="empty"><p>${T.none}</p></div>`;
    return;
  }

  const byYear = {};
  filtered.forEach(e => (byYear[e.year] ||= []).push(e));
  const years = Object.keys(byYear).sort((a, b) => b - a);

  c.innerHTML = years.map(y => `
    <div class="year-group">
      <div class="year-heading"><span>${y}</span> — ${T.items(byYear[y].length)}</div>
      ${byYear[y].map(rowHTML).join('')}
    </div>`).join('');
}

const TAG_ORDER = { chair: 0, spc: 1, steering: 2, pc: 3, editor: 4, other: 5 };

async function init() {
  buildFilters();
  let data = null;
  try {
    const res = await fetch('activity.json');
    if (res.ok) data = await res.json();
  } catch (e) {}

  if (!data) {
    document.getElementById('timeline').innerHTML =
      `<div class="empty"><p>⚠️ ${T.loadfail}</p><small>${T.loadhint}</small></div>`;
    return;
  }

  ROLES     = data.standing   || [];
  ALL       = data.activities || [];
  REVIEWING = data.reviewing  || [];

  ALL.sort((a, b) =>
    (b.year - a.year) ||
    ((TAG_ORDER[a.tag] ?? 9) - (TAG_ORDER[b.tag] ?? 9)) ||
    bodyOf(a).localeCompare(bodyOf(b), 'ja')
  );

  renderStats();
  renderRoles();
  renderReviewing();
  render();
}

window.addEventListener('scroll', () => {
  document.getElementById('back-top').classList.toggle('on', scrollY > 400);
});

init();
</script>
