# トップページ「お知らせ」欄など、日付で掲載対象が変わる焼き込み内容を月1回作り直す。
# bib / JSON を変更しなくても日付の経過で表示が変わるため（README 5章参照）。
# 変更がなければ何もしない。Actions タブから手動実行もできる。
name: Monthly static rebuild

on:
  schedule:
    - cron: '23 0 1 * *'   # 毎月1日 00:23 UTC（日本時間 09:23）
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: monthly-rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0   # sitemap の lastmod に各ファイルの最終コミット日を使うため

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Rebuild static content
        run: node tools/build-static.js

      - name: Commit and push if changed
        id: commit
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Monthly rebuild of date-dependent static content ($(date +%Y-%m-%d))"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # GITHUB_TOKEN による push では Pages の公開処理が自動で走らないことがあるため、明示的に依頼する
      - name: Request a GitHub Pages build
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
