<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Awards — Takayuki Ito</title>
  <meta name="description" content="Awards and honors received by Takayuki Ito, Professor at Kyoto University — including the MEXT Prize for Science and Technology, JSPS Prize, and AAMAS Best Paper Award.">
  <link rel="canonical" href="https://takayuki-ito.com/awards.html">
  <link rel="alternate" hreflang="en" href="https://takayuki-ito.com/awards.html">
  <link rel="alternate" hreflang="ja" href="https://takayuki-ito.com/awards-j.html">
  <link rel="alternate" hreflang="x-default" href="https://takayuki-ito.com/awards.html">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Awards — Takayuki Ito">
  <meta property="og:description" content="MEXT Prize for Science and Technology, JSPS Prize, AAMAS Best Paper Award, and more.">
  <meta property="og:image" content="https://takayuki-ito.com/ito20210307.jpeg">
  <meta property="og:url" content="https://takayuki-ito.com/awards.html">
  <meta name="twitter:card" content="summary">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #0f2044;
      --accent:  #2563eb;
      --accent-light: #eff6ff;
      --accent-mid:   #bfdbfe;
      --text:    #1f2937;
      --text-sec:#6b7280;
      --bg:      #ffffff;
      --bg-sec:  #f9fafb;
      --border:  #e5e7eb;
      --radius:  8px;
      --max-w:   900px;
      --nav-h:   58px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { font-family: 'Inter', system-ui, sans-serif; color: var(--text); background: var(--bg); font-size: 15px; line-height: 1.7; -webkit-font-smoothing: antialiased; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    nav {
      position: sticky; top: 0; z-index: 200;
      height: var(--nav-h);
      background: rgba(255,255,255,0.93);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
    }
    .nav-inner {
      max-width: var(--max-w); margin: 0 auto;
      padding: 0 1.5rem; height: 100%;
      display: flex; align-items: center; gap: 1rem;
    }
    .nav-back {
      font-size: .82rem; font-weight: 700;
      color: var(--primary); white-space: nowrap;
      padding: .3rem .75rem; border-radius: 6px;
      background: var(--accent-light); border: 1px solid var(--accent-mid);
    }
    .nav-back:hover { background: #dbeafe; text-decoration: none; }
    .nav-title { font-weight: 600; font-size: .95rem; color: var(--primary); }
    .nav-title span { font-weight: 400; color: var(--text-sec); font-size: .85rem; margin-left: .5rem; }
    .lang-pill {
      margin-left: auto;
      display: inline-flex; border: 1px solid var(--border);
      border-radius: 20px; overflow: hidden;
    }
    .lang-pill a {
      font-size: .75rem; font-weight: 700;
      padding: .22rem .6rem; color: var(--text-sec); transition: all .15s;
    }
    .lang-pill a.on { background: var(--accent); color: #fff; }
    .lang-pill a:hover { text-decoration: none; }

    .wrap { max-width: var(--max-w); margin: 0 auto; padding: 2.5rem 1.5rem 5rem; }

    .controls {
      display: flex; flex-wrap: wrap; gap: .75rem;
      align-items: center; margin-bottom: 1.75rem;
      padding-bottom: 1.5rem; border-bottom: 1px solid var(--border);
    }
    .search-box {
      flex: 1 1 220px;
      display: flex; align-items: center; gap: .5rem;
      background: var(--bg-sec); border: 1px solid var(--border);
      border-radius: var(--radius); padding: .45rem .85rem;
    }
    .search-box input {
      border: none; background: transparent; outline: none;
      font-size: .875rem; font-family: inherit; width: 100%; color: var(--text);
    }
    .filter-group { display: flex; gap: .35rem; flex-wrap: wrap; }
    .filter-btn {
      font-size: .78rem; font-weight: 600;
      padding: .3rem .75rem; border-radius: 20px;
      border: 1px solid var(--border); background: var(--bg-sec);
      color: var(--text-sec); cursor: pointer; transition: all .15s;
      white-space: nowrap; font-family: inherit;
    }
    .filter-btn:hover  { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }
    .filter-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .count-bar { font-size: .8rem; color: var(--text-sec); margin-left: auto; white-space: nowrap; }

    .year-group { margin-bottom: 2.25rem; }
    .year-heading {
      font-size: .78rem; font-weight: 700; letter-spacing: .08em;
      text-transform: uppercase; color: var(--text-sec);
      margin-bottom: .25rem; padding-bottom: .4rem;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: .5rem;
    }
    .year-heading span { font-size: 1rem; font-weight: 700; color: var(--primary); }

    .award-row {
      display: grid;
      grid-template-columns: 110px 1fr;
      gap: 1rem;
      padding: .85rem .25rem;
      border-bottom: 1px solid var(--border);
      align-items: baseline;
    }
    .award-row:last-child { border-bottom: none; }
    .award-tag {
      font-size: .68rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: .04em;
      padding: .15rem .55rem; border-radius: 20px;
      text-align: center; justify-self: start;
    }
    .tag-national   { background: #fef3c7; color: #92400e; border: 1px solid #fde68a; }
    .tag-society    { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }
    .tag-bestpaper  { background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; }
    .tag-competition{ background: #fce7f3; color: #9d174d; border: 1px solid #fbcfe8; }
    .tag-other      { background: #f3f4f6; color: #374151; border: 1px solid #d1d5db; }
    .award-body { font-size: .9rem; line-height: 1.7; }
    .award-body strong { color: var(--primary); }

    .empty { text-align: center; padding: 4rem 1rem; color: var(--text-sec); }
    .empty p { font-size: 1.1rem; margin-bottom: .5rem; }

    #back-top {
      position: fixed; bottom: 2rem; right: 1.5rem;
      background: var(--accent); color: #fff;
      width: 42px; height: 42px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem; box-shadow: 0 4px 12px rgba(37,99,235,.35);
      opacity: 0; transition: opacity .3s; z-index: 900;
    }
    #back-top.on { opacity: 1; }
    #back-top:hover { background: #1d4ed8; text-decoration: none; }

    @media (max-width: 600px) {
      .award-row { grid-template-columns: 1fr; gap: .25rem; }
      .controls { flex-direction: column; align-items: stretch; }
    }
  </style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a class="nav-back" href="index.html">← Takayuki Ito</a>
    <span class="nav-title">Awards <span>Takayuki Ito</span></span>
    <div class="lang-pill">
      <a href="awards.html" class="on">EN</a>
      <a href="awards-j.html">JA</a>
    </div>
  </div>
</nav>

<div class="wrap">
  <div class="controls">
    <div class="search-box">
      <span>🔍</span>
      <input type="text" id="search" placeholder="Search awards…" oninput="render()">
    </div>
    <div class="filter-group" id="tag-filters">
      <button class="filter-btn active" onclick="setFilter('all',this)">All</button>
      <button class="filter-btn" onclick="setFilter('national',this)">🏅 National</button>
      <button class="filter-btn" onclick="setFilter('society',this)">🏛 Society</button>
      <button class="filter-btn" onclick="setFilter('bestpaper',this)">📰 Best Paper</button>
      <button class="filter-btn" onclick="setFilter('competition',this)">🥇 Competition</button>
    </div>
    <span class="count-bar" id="count-bar"></span>
  </div>
  <div id="awards-list"></div>
</div>

<a id="back-top" href="#">↑</a>

<script>
const LANG = 'en';
const TAG_LABEL = {
  national:'National', society:'Society', bestpaper:'Best Paper',
  competition:'Competition', other:'Other'
};

let ALL = [];
let activeFilter = 'all';

function setFilter(f, btn) {
  activeFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function bodyOf(e)   { return e[LANG] || e.ja || e.en || ''; }
function linkLabel(e){ return e['link_'+LANG] || (LANG==='ja' ? 'リンク →' : 'Link →'); }
function yearOf(e)   { return e.year || (e.date || '').slice(0,4) || '—'; }

function render() {
  const q = document.getElementById('search').value.toLowerCase();
  const filtered = ALL.filter(e => {
    if (activeFilter !== 'all' && (e.tag || 'other') !== activeFilter) return false;
    if (q) {
      const blob = (bodyOf(e) + ' ' + yearOf(e)).toLowerCase();
      if (!blob.includes(q)) return false;
    }
    return true;
  });

  document.getElementById('count-bar').textContent = `${filtered.length} item${filtered.length===1?'':'s'}`;

  const byYear = {};
  filtered.forEach(e => {
    const y = yearOf(e);
    (byYear[y] ||= []).push(e);
  });
  const years = Object.keys(byYear).sort((a,b) => b.localeCompare(a));

  const c = document.getElementById('awards-list');
  if (!filtered.length) {
    c.innerHTML = '<div class="empty"><p>No awards found.</p></div>';
    return;
  }
  c.innerHTML = years.map(y => `
    <div class="year-group">
      <div class="year-heading"><span>${y}</span> — ${byYear[y].length} item${byYear[y].length===1?'':'s'}</div>
      ${byYear[y].map(rowHTML).join('')}
    </div>
  `).join('');
}

function rowHTML(e) {
  const tag  = e.tag || 'other';
  const body = bodyOf(e);
  const link = e.link ? ` <a href="${e.link}" target="_blank" rel="noopener">${linkLabel(e)}</a>` : '';
  return `
  <div class="award-row">
    <span class="award-tag tag-${tag}">${TAG_LABEL[tag] || tag}</span>
    <div class="award-body">${body}${link}</div>
  </div>`;
}

async function init() {
  try {
    const res = await fetch('awards.json');
    if (res.ok) ALL = await res.json();
  } catch(e) {}
  ALL.sort((a,b) => {
    const ya = yearOf(a), yb = yearOf(b);
    if (yb !== ya) return yb.localeCompare(ya);
    return (b.date || '').localeCompare(a.date || '');
  });
  if (!ALL.length) {
    document.getElementById('awards-list').innerHTML =
      '<div class="empty"><p>⚠️ Could not load awards.json</p><small>Open this page via a web server.</small></div>';
    return;
  }
  render();
}

window.addEventListener('scroll', () => {
  document.getElementById('back-top').classList.toggle('on', scrollY > 400);
});

init();
</script>
</body>
</html>
